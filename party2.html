<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>파티룸 2차 투표 · 2026 워크샵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FFFFFF; --surface:#F1F4F2; --ink:#121714; --muted:#66706B; --line:#DCE2DE;
  --accent:#1D6B4C; --accent-ink:#FFFFFF; --accent-soft:#E2EEE8; --accent-mid:#9CC5B2;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --surface:#1A201D; --ink:#EEF2EF; --muted:#9AA39E; --line:#2C3430;
    --accent:#5FC497; --accent-ink:#0B1410; --accent-soft:#183027; --accent-mid:#2F6B52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#1A201D; --ink:#EEF2EF; --muted:#9AA39E; --line:#2C3430;
  --accent:#5FC497; --accent-ink:#0B1410; --accent-soft:#183027; --accent-mid:#2F6B52;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 64px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:900;font-size:17px;letter-spacing:-0.02em;margin-right:auto;text-decoration:none}
.steps{display:flex;gap:4px}
.steps a{font-size:14px;font-weight:700;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:999px}
.steps a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* type */
.h-xl{font-weight:900;font-size:clamp(48px,14vw,96px);line-height:.95;letter-spacing:-0.045em;margin:40px 0 12px}
.h-l{font-weight:900;font-size:clamp(32px,8vw,48px);line-height:1.05;letter-spacing:-0.035em;margin:32px 0 8px}
.h-m{font-weight:900;font-size:22px;letter-spacing:-0.02em;margin:44px 0 14px}
.sub{color:var(--muted);font-size:16px;margin:0}
.small{font-size:13px;color:var(--muted)}

/* overview stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:32px}
.stat{background:var(--bg);padding:20px 18px 18px}
.stat b{display:block;font-weight:900;font-size:clamp(34px,9vw,52px);letter-spacing:-0.04em;line-height:1}
.stat b small{font-size:.42em;font-weight:700;letter-spacing:0;margin-left:2px}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flow li{background:var(--surface);border-radius:14px;padding:16px 14px}
.flow li i{font-style:normal;font-weight:900;font-size:28px;color:var(--accent);display:block;line-height:1}
.flow li p{margin:10px 0 0;font-weight:700;font-size:14px;line-height:1.35}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:16px 22px;font-weight:900;font-size:17px;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.opt:focus-within,.steps a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:10px;margin-top:28px}

/* course cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.card{display:block;text-decoration:none;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);position:relative}
.card .art{background:var(--accent-soft);aspect-ratio:4/3;display:block}
.card .art svg{width:100%;height:100%;display:block}
.card .body{padding:14px 14px 16px}
.card .no{font-weight:900;font-size:13px;color:var(--accent)}
.card .ttl{font-weight:900;font-size:22px;letter-spacing:-0.03em;line-height:1.15;margin-top:2px}
.card .meta{font-size:13px;color:var(--muted);margin-top:6px}
.card .cost{font-weight:900;font-size:18px;margin-top:10px;letter-spacing:-0.02em}
.card .cost small{font-weight:500;font-size:12px;color:var(--muted);margin-left:4px}
.mine{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}

/* result */
.result{margin-top:28px;border:1px solid var(--line);border-radius:20px;padding:18px}
.result-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.result-h b{font-weight:900;font-size:18px}
.bars{margin-top:14px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:10px;font-weight:700;font-size:14px}
.bar .track{height:28px;background:var(--surface);border-radius:8px;overflow:hidden;position:relative}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:8px;width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar .n{text-align:right;font-weight:900}
.blind .track{background:repeating-linear-gradient(-45deg,var(--surface) 0 8px,var(--line) 8px 16px)}
.blind .n{color:var(--muted)}
.owner{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:10px}
.owner .cnt{font-weight:900;font-size:15px}

/* detail */
.back{display:inline-block;margin-top:20px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.flow-line{list-style:none;margin:0;padding:18px 8px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:var(--surface);position:relative}
.flow-line li{display:grid;justify-items:center;text-align:center;gap:4px;position:relative}
.flow-line li:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);border-top:2px dashed var(--ink)}
.flow-line .fd{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:13px;display:grid;place-items:center}
.flow-line li.o .fd{background:var(--ink);color:var(--bg)}
.flow-line b{font-weight:900;font-size:15px;margin-top:4px}
.flow-line em{font-style:normal;font-size:12px;color:var(--muted);line-height:1.3}
.mapbox{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.mapbox svg{display:block;width:100%;height:auto}
.legs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.legs li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:15px}
.legs .lg{display:grid;gap:1px;min-width:0}
.maplink{font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.route-btns{display:grid;gap:8px;margin-top:16px}
.route-btns .btn{font-size:15px;padding:14px 18px}
.legs .dot{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:13px;display:grid;place-items:center}
.legs .dot.o{background:var(--ink);color:var(--bg)}
.legs b{font-weight:700}
.legs em{font-style:normal;font-size:13px;color:var(--muted)}

.tt{display:grid;grid-template-columns:52px 1fr;gap:0 12px}
.tt .t{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;padding-top:9px}
.tt .blk{border-radius:12px;margin-bottom:6px;padding:9px 14px;display:flex;flex-direction:column;justify-content:center}
.tt .blk b{font-weight:700;font-size:15px;line-height:1.3}
.tt .blk span{font-size:12px;opacity:.75}
.k-move{background:var(--surface)}
.k-food{background:var(--accent-soft)}
.k-work{background:var(--surface);box-shadow:inset 3px 0 0 var(--ink)}
.k-share{background:var(--ink);color:var(--bg)}
.k-play{background:var(--accent);color:var(--accent-ink)}

.cost-rows{display:grid;gap:12px}
.cr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.cr .lb{font-weight:700}
.cr .am{font-weight:900;font-variant-numeric:tabular-nums}
.cr .tr{grid-column:1/-1;height:10px;background:var(--surface);border-radius:5px;overflow:hidden}
.cr .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.cr .nt{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.total{margin-top:18px;padding:18px;border-radius:16px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.total b{font-weight:900;font-size:30px;letter-spacing:-0.03em;line-height:1}
.total span{font-size:13px;opacity:.8}
.total .pp{text-align:right}
.total .pp b{font-size:20px}

.stays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stay-card{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px}
.gallery figure{margin:0;scroll-snap-align:start;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--surface)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{position:absolute;left:8px;bottom:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.gallery .ph{display:grid;place-items:center;border:1px dashed var(--line)}
.gallery .ph span{font-weight:900;font-size:22px;color:var(--muted)}
.stay-info{display:grid;gap:2px;padding:12px 16px 16px;font-size:14px;color:var(--muted)}
.stay-info b{font-weight:900;font-size:20px;color:var(--ink);letter-spacing:-0.02em}
.stay-info .rooms{font-weight:700;color:var(--ink);font-size:15px;margin-top:4px}
.stay-info .pr{font-weight:900;color:var(--ink);font-size:16px;margin-top:6px}
.stay{border:1px dashed var(--line);border-radius:14px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;background:var(--surface)}
.stay b{font-weight:900;font-size:16px}
.stay span{font-size:12px;color:var(--muted)}
.venues{display:grid;gap:10px}
.venue{display:grid;gap:6px;border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden}
.venue.pick{border:2px solid var(--accent);background:var(--accent-soft)}
.venue .vt{display:flex;align-items:center;gap:8px}
.venue .vt b{font-weight:900;font-size:17px;letter-spacing:-0.02em}
.venue .vt i{font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px}
.venue .vp{font-weight:900;font-size:22px;letter-spacing:-0.03em}
.venue .vm{font-size:13px;color:var(--muted)}
.venue .vg{display:flex;flex-wrap:wrap;gap:4px}
.venue .vg em{font-style:normal;font-size:12px;font-weight:700;background:var(--surface);border-radius:999px;padding:3px 9px}
.venue.pick .vg em{background:var(--bg)}
.venue .vf{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.venue .gallery{margin:-10px -10px 4px;padding:0}
.venue .vb{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.venue.selectable{cursor:pointer;position:relative;border-width:2px}
.venue.selectable input{position:absolute;opacity:0;pointer-events:none}
.venue.selectable:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.venue.selectable:has(input:checked) .vg em{background:var(--bg)}
.venue .ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;flex:none}
.venue .ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .2s}
.venue.selectable:has(input:checked) .ring{border-color:var(--accent)}
.venue.selectable:has(input:checked) .ring::after{transform:scale(1)}
.venue .vd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:2px 0;font-size:14px}
.venue .vd dt{color:var(--muted);font-weight:500}
.venue .vd dd{margin:0;font-weight:700}
.bar.win .fill{background:var(--ink)}
.bar.win{font-weight:900}
.verdict{margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:15px}
.verdict b{font-weight:900}
.tiebtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.tools{margin-top:28px;border:1px dashed var(--line);border-radius:16px;padding:14px 16px}
.tools summary{font-weight:700;cursor:pointer}
.tools .field button{padding:12px 14px}
.venue .vl{font-weight:700;font-size:14px;color:var(--accent);margin-top:2px}

/* vote */
.opts{display:grid;gap:12px;margin-top:28px}
.opt{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;background:var(--bg)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt .ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .2s}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .ring{border-color:var(--accent)}
.opt:has(input:checked) .ring::after{transform:scale(1)}
.opt b{display:block;font-weight:900;font-size:22px;letter-spacing:-0.03em}
.opt span{font-size:14px;color:var(--muted)}
.note{margin-top:14px;font-size:14px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;transition:all .25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:inherit}
.field button{border:0;border-radius:12px;padding:0 16px;background:var(--surface);font-weight:700;cursor:pointer}

@media (max-width:420px){
  .flow{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr}
  .card{display:grid;grid-template-columns:130px 1fr}
  .card .art{aspect-ratio:auto;height:100%}
}

/* ---------- fallback (no :has) ---------- */
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .ring{border-color:var(--accent)}
.opt.chosen .ring::after{transform:scale(1)}
.venue.selectable.chosen{border-color:var(--accent);background:var(--accent-soft)}
.venue.selectable.chosen .ring{border-color:var(--accent)}
.venue.selectable.chosen .ring::after{transform:scale(1)}
.venue.selectable.chosen .vg em{background:var(--bg)}
img{max-width:100%}
.split{display:block}
.split>section{min-width:0}

/* ---------- tablet ---------- */
@media (min-width:768px){
  .wrap{max-width:960px;padding:0 32px 88px}
  .top-in{max-width:960px;padding:14px 32px}
  .h-xl{margin-top:56px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat.wide{grid-column:auto}
  .cards{gap:20px}
  .card .ttl{font-size:26px}
  .opts{grid-template-columns:1fr 1fr}
  .venues{grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .venue .gallery{grid-auto-columns:88%}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
  .stay-card{display:grid;grid-template-columns:1.6fr 1fr;align-items:stretch}
  .stay-card .gallery{grid-auto-columns:92%}
  .stay-info{align-content:center;padding:20px 24px}
  .row{max-width:560px}
  .result{padding:22px 24px}
  .flow-line{padding:24px 16px}
  .flow-line b{font-size:17px}
  .flow-line em{font-size:13px}
}
/* ---------- desktop ---------- */
@media (min-width:1100px){
  .wrap{max-width:1120px}
  .top-in{max-width:1120px}
  .venues{grid-template-columns:repeat(3,1fr)}
  .venue .gallery{grid-auto-columns:100%}
  .split{gap:56px}
  .sub{font-size:17px}
}
@media (hover:hover){
  .card,.venue.selectable,.opt{transition:border-color .15s,transform .15s}
  .card:hover,.venue.selectable:hover,.opt:hover{border-color:var(--accent)}
  .btn:hover{filter:brightness(1.08)}
}

/* ---------- 진행 안내 ---------- */
.stepper{max-width:720px;margin:0 auto;padding:0 20px 10px}
.stepper ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stepper li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.stepper li span{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:11px;background:var(--surface);color:var(--muted)}
.stepper li em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper li.done span{background:var(--accent);color:var(--accent-ink)}
.stepper li.cur{color:var(--ink);font-weight:700}
.stepper li.cur span{background:var(--ink);color:var(--bg);animation:pulse 1.6s ease-in-out infinite}
.stepper li.skip{opacity:.45;text-decoration:line-through}
.st-bar{height:3px;background:var(--surface);border-radius:2px;margin-top:8px;overflow:hidden}
.st-bar i{display:block;height:100%;background:var(--accent);transition:width .8s cubic-bezier(.2,.7,.2,1)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 35%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.eyebrow{display:inline-block;margin-top:28px;font-size:13px;font-weight:700;color:var(--accent)}
.eyebrow+.h-l{margin-top:6px}
.now{margin-top:28px;border-radius:20px;background:var(--ink);color:var(--bg);padding:22px 20px;display:grid;gap:10px;animation:rise .5s ease-out both}
.now-tag{font-size:12px;font-weight:700;opacity:.7}
.now>b{font-weight:900;font-size:24px;letter-spacing:-0.03em;line-height:1.2}
.now p{margin:0;opacity:.8;font-size:15px}
.now .meter{background:color-mix(in srgb,var(--bg) 10%,transparent);border:0}
.now .meter .small{color:inherit;opacity:.75}
.now .meter-t{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.now .btn{margin-top:6px}
.meter{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.meter-h{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.meter-h b{font-weight:900;font-variant-numeric:tabular-nums}
.meter-t{height:10px;background:var(--surface);border-radius:5px;overflow:hidden}
.meter-t i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.flow li{transition:background .3s}
.flow li.on{background:var(--accent-soft)}
.card.winner{border:2px solid var(--accent)}
.mine.win{background:var(--accent);color:var(--accent-ink)}
.sticky-cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4}
.sticky-cta .btn{box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 25%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#app>*{animation:rise .35s ease-out both}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ink) 70%,transparent);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.ov-card{width:min(440px,100%);background:var(--bg);color:var(--ink);border-radius:24px;padding:28px 24px;display:grid;gap:10px;text-align:center;transform:scale(.9) translateY(20px);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.overlay.on .ov-card{transform:none}
.ov-tag{font-size:13px;font-weight:700;color:var(--accent)}
.ov-t{font-weight:900;font-size:26px;letter-spacing:-0.03em;line-height:1.2}
.ov-card p{margin:0;color:var(--muted)}
.ov-big{margin:8px 0;padding:18px;border-radius:16px;background:var(--accent-soft);color:var(--ink);font-weight:900;font-size:22px;letter-spacing:-0.02em;animation:pop .6s .25s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.final-h{margin-top:8px}
.final-grid{display:grid;gap:16px;margin-top:24px}
.final-photo{margin:0;border-radius:20px;overflow:hidden;position:relative;background:var(--surface);aspect-ratio:4/3}
.final-photo img{width:100%;height:100%;object-fit:cover;display:block}
.final-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;display:grid;gap:2px;font-size:13px}
.final-photo figcaption b{font-weight:900;font-size:20px}
.final-costs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.final-costs li{display:flex;justify-content:space-between;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px}
.final-costs b{font-weight:900}
.final-tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.final-tl li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:15px}
.final-tl b{font-weight:900;font-variant-numeric:tabular-nums}
@media (min-width:768px){
  .stepper{max-width:960px;padding:0 32px 12px}
  .stepper li{font-size:13px}
  .now{padding:28px}
  .final-grid{grid-template-columns:1.4fr 1fr;align-items:start}
}
@media (min-width:1100px){ .stepper{max-width:1120px} }
@media (max-width:420px){ .stepper li em{font-size:11px} .stepper li{gap:4px} }
.namepick{display:grid;gap:6px;margin-top:20px}
.namepick label{font-weight:700;font-size:14px}
.namepick select{font:inherit;font-size:16px;padding:14px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
.whoami{margin:20px 0 0;font-size:14px;color:var(--muted)}
.whoami b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   가을 테마 (캐치테이블 모티브)
   ========================================================= */
:root{
  --bg:#FFFFFF; --surface:#F7F4F1; --band:#F3EEE9; --ink:#1E1915; --muted:#8C837B; --line:#ECE5DE;
  --accent:#E4531F; --accent-ink:#FFFFFF; --accent-soft:#FFF1E8; --accent-mid:#F3B08C; --deep:#7B3418; --gold:#C98A2B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151110; --surface:#211B18; --band:#1B1614; --ink:#F3EDE7; --muted:#A1968D; --line:#332A25;
    --accent:#FF7442; --accent-ink:#1A0E08; --accent-soft:#33201A; --accent-mid:#7A3D24; --deep:#E7A27E; --gold:#E0B060;
  }
}
:root[data-theme="dark"]{
  --bg:#151110; --surface:#211B18; --band:#1B1614; --ink:#F3EDE7; --muted:#A1968D; --line:#332A25;
  --accent:#FF7442; --accent-ink:#1A0E08; --accent-soft:#33201A; --accent-mid:#7A3D24; --deep:#E7A27E; --gold:#E0B060;
}
body{font-family:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-0.01em;background:var(--bg)}
#app>*{animation:none}

/* 헤더 · 탭 */
.top{border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px}
.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.steps{gap:2px}
.steps a{border-radius:0;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.steps a[aria-current="page"]{background:none;color:var(--ink);font-weight:800;border-bottom-color:var(--ink)}
.stepper li span{width:18px;height:18px;font-size:10px}
.stepper li.cur span{animation:none;background:var(--accent);color:var(--accent-ink)}
.stepper li.done span{background:var(--deep);color:var(--bg)}
.stepper li.cur{color:var(--accent)}
.st-bar{height:2px}

/* 타이포 */
.h-xl{font-weight:800;letter-spacing:-0.035em}
.h-l{font-weight:800;font-size:clamp(26px,6.4vw,36px);letter-spacing:-0.03em;line-height:1.25;margin:10px 0 6px}
.h-m{font-weight:800;font-size:19px;letter-spacing:-0.02em;margin:40px 0 14px;display:flex;align-items:center;gap:8px}
.h-m::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.sub{font-size:15px;color:var(--muted)}
.eyebrow{margin-top:22px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0}

#app>.h-l:first-child{margin-top:28px}
/* 히어로 */
.hero{position:relative;margin:16px -20px 0;aspect-ratio:4/3.1;overflow:hidden;border-radius:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) sepia(.12)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,10,0) 30%,rgba(30,18,10,.78) 100%)}
.hero-txt{position:absolute;left:20px;right:20px;bottom:22px;z-index:1;color:#fff}
.hero-chip{display:inline-block;font-size:12px;font-weight:700;background:var(--accent);color:#fff;border-radius:4px;padding:4px 8px}
.hero-txt h1{margin:10px 0 6px;font-weight:800;font-size:clamp(28px,7.6vw,44px);line-height:1.2;letter-spacing:-0.035em}
.hero-txt p{margin:0;font-size:15px;opacity:.9}

/* 지금 할 일 */
.now{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:20px;margin-top:20px;animation:none;gap:8px}
.now-tag{color:var(--accent);opacity:1;font-weight:800}
.now>b{font-size:20px;font-weight:800}
.now p{opacity:1;color:var(--muted);font-size:14px}
.now .meter{background:var(--bg);border:1px solid var(--line)}
.now .meter .small{color:var(--muted);opacity:1}
.now .meter-t{background:var(--surface)}

/* 버튼 */
.btn{border-radius:10px;padding:15px 20px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:1;background:var(--surface);color:var(--muted);border:0}
@media (hover:hover){.btn:hover{filter:brightness(.96)}}

/* 정보 카드 */
.stats{border-radius:14px;border-color:var(--line);background:var(--line)}
.stat{padding:16px}
.stat b{font-weight:800;font-size:clamp(26px,7vw,38px);letter-spacing:-0.03em}
.stat span{font-size:13px}
.flow li{background:var(--surface);border-radius:12px}
.flow li i{color:var(--accent);font-weight:800;font-size:22px}
.flow li.on{background:var(--accent-soft)}
.meter{border-radius:12px}
.meter-t{height:8px}
.meter-t i{background:var(--accent)}

/* 코스 카드 (식당 카드 스타일) */
.cards{gap:24px 16px}
.card{border:0;border-radius:0;background:transparent}
.card .art{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .art img{transform:scale(1.03)}
.card .body{padding:12px 2px 0}
.card .no{color:var(--accent);font-weight:700;font-size:13px}
.card .ttl{font-weight:800;font-size:20px}
.card .meta{font-size:13px;color:var(--muted)}
.card .cost{font-weight:800;font-size:17px;margin-top:8px}
.card.winner .art{outline:3px solid var(--accent);outline-offset:-3px}
.mine{top:10px;left:10px;border-radius:4px;background:rgba(20,14,10,.75);color:#fff;font-weight:700}
.mine.win{background:var(--accent)}
@media (max-width:420px){.card{display:block}.card .art{aspect-ratio:4/3;height:auto}}

/* 상세 */
.cover{margin:12px -20px 0;aspect-ratio:16/10;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.back{margin-top:16px;font-weight:600}
.chips{gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);font-weight:600;color:var(--ink);border-radius:999px}
.flow-line{background:var(--bg);border-color:var(--line);border-radius:14px}
.flow-line .fd{background:var(--accent)}
.flow-line li.o .fd{background:var(--deep);color:var(--bg)}
.flow-line li:not(:last-child)::after{border-top-color:var(--accent-mid)}
.mapbox{border-radius:14px;border-color:var(--line);background:var(--surface)}
.legs .dot{background:var(--accent)}
.legs .dot.o{background:var(--deep)}
.maplink{border-radius:6px;font-weight:600;color:var(--ink)}

/* 타임테이블 */
.tt .blk{border-radius:10px}
.k-move{background:var(--surface)}
.k-food{background:#FBEAD9;color:#4A2A12}
.k-work{background:var(--surface);box-shadow:inset 3px 0 0 var(--gold)}
.k-share{background:var(--deep);color:#FFF6EF}
.k-play{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-food{background:#3A2A1C;color:#F6DCC2}}

/* 비용 */
.cr .tr{height:6px}
.cr .tr i{background:var(--accent)}
.total{background:var(--deep);color:#FFF6EF;border-radius:14px}
.total b{font-weight:800}

/* 숙소 · 파티룸 카드 */
.stay-card,.venue{border-color:var(--line);border-radius:14px}
.gallery figcaption{background:rgba(20,14,10,.7);border-radius:4px;font-weight:600}
.stay-info b,.venue .vt b{font-weight:800}
.venue.pick{border:1px solid var(--accent);background:var(--bg)}
.venue .vt i{border-radius:4px;background:var(--accent)}
.venue .vp{font-weight:800;color:var(--ink)}
.venue .vg em{background:var(--surface);border-radius:4px;font-weight:600}
.venue.selectable{border-width:1px}
.venue.selectable:has(input:checked),.venue.selectable.chosen{border:2px solid var(--accent);background:var(--accent-soft)}

/* 투표 선택지 */
.opt{border:1px solid var(--line);border-radius:14px}
.opt b{font-weight:800;font-size:19px}
.opt:has(input:checked),.opt.chosen{border:2px solid var(--accent);background:var(--accent-soft)}
.namepick select{border:1px solid var(--line);border-radius:10px}

/* 결과 */
.result{border-radius:14px;border-color:var(--line)}
.bar .track{border-radius:6px}
.bar .fill{background:var(--accent-mid);border-radius:6px}
.bar.win .fill{background:var(--accent)}
.verdict{background:var(--accent-soft);color:var(--ink);border-radius:10px}
.verdict b{color:var(--accent)}
.blind .track{background:repeating-linear-gradient(-45deg,var(--surface) 0 8px,var(--band) 8px 16px)}

/* 알림 (바텀시트) */
.overlay{align-items:end;padding:0;background:rgba(20,12,8,.55)}
.ov-card{border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:28px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.overlay.on .ov-card{transform:none}
.ov-card::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-12px auto 10px}
.ov-tag{color:var(--accent);font-weight:800}
.ov-t{font-weight:800;font-size:23px}
.ov-big{background:var(--accent-soft);color:var(--accent);border-radius:12px;font-weight:800}
@media (min-width:768px){.overlay{align-items:center;padding:24px}.ov-card{border-radius:20px;transform:translateY(24px) scale(.97)}}

.maplink.strong{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.support{list-style:none;margin:12px 0 0;padding:14px 16px;border-radius:12px;background:var(--accent-soft);display:grid;gap:6px}
.support li{display:flex;justify-content:space-between;font-size:14px}
.support li:last-child{padding-top:6px;border-top:1px solid var(--accent-mid);font-weight:800;color:var(--accent)}
.support b{font-weight:800}
/* 최종 */
.final-h{font-weight:800}
.final-photo{border-radius:14px}
.toast{border-radius:10px;background:var(--ink);font-weight:600}
.tools{border-style:solid;border-color:var(--line);border-radius:12px}
.whoami b{color:var(--accent)}

@media (min-width:768px){
  .hero{margin:20px 0 0;border-radius:18px;aspect-ratio:21/9}
  .hero-txt{left:36px;bottom:32px}
  .cover{margin:16px 0 0;border-radius:16px;aspect-ratio:21/9}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home">파티룸 2차 투표</a>
  <nav class="steps" aria-label="단계">
    <a href="#home" data-v="home">개요</a>
    <a href="#vote" data-v="vote">투표</a>
    <a href="#result" data-v="result" hidden>결과</a>
  </nav>
</div><div class="stepper" id="stepper"></div></header>
<main class="wrap" id="app"></main>
<div class="overlay" id="overlay" role="dialog" aria-live="assertive"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dl class="vd"><dt>이용 시간</dt><dd>${esc(v.time)}</dd><dt>시설</dt><dd>${esc(v.extras)}</dd><dt>위치</dt><dd>${esc(v.addr)}</dd><dt>특징</dt><dd>${esc(v.meta)}</dd></dl>
    <span class="vg">${v.tags.map(t=>`<em>${esc(t)}</em>`).join('')}</span>
    <span class="vb"><a class="maplink strong" href="${v.link}" target="_blank" rel="noopener noreferrer">네이버에서 장소 보기</a></span>
  </${tag}>`;
}
function namePicker(){
  if(S.myName) return `<p class="whoami">투표자 <b>${esc(S.myName)}</b></p>`;
  if(!S.names.length) return `<p class="note">관리자가 팀원 명단을 등록하면 투표할 수 있습니다.</p>`;
  return `<div class="namepick"><label for="np">내 이름</label><select id="np"><option value="">이름을 골라 주세요</option>${S.names.map(n=>`<option value="${esc(n)}" ${S.nameDraft===n?'selected':''} ${S.voted.includes(n)?'disabled':''}>${esc(n)}${S.voted.includes(n)?' · 투표 완료':''}</option>`).join('')}</select><span class="small">이름당 1표입니다.</span></div>`;
}
function bars(anim){
  const max=Math.max(1,...VENUES.map(v=>S.counts[v.id]||0)), w=win();
  return `<div class="bars">${VENUES.map(v=>{const n=S.counts[v.id]||0;return `<div class="bar ${w===v.id?'win':''}"><span>${esc(v.short)}</span><span class="track"><span class="fill" data-w="${n/max*100}" style="width:${anim?0:n/max*100}%"></span></span><span class="n" data-n="${n}">${anim?0:n}표</span></div>`}).join('')}</div>`;
}
function adminTools(){
  if(!S.isAdmin) return `<details class="tools" style="margin-top:40px"><summary>관리자</summary><div class="field" style="margin-top:10px"><input id="pin" type="password" inputmode="numeric" placeholder="관리자 PIN"><button data-act="login">확인</button></div></details>`;
  return `<details class="tools" style="margin-top:40px" ${S.toolsOpen?'open':''}><summary>관리자 도구</summary>
    <p class="small">결과 공개 기준 <b>${TH()}명</b> · 현재 ${S.n}명 참여 · 명단 ${S.names.length}명 (1차 투표 명단 그대로 사용)</p>
    <div class="field" style="flex-wrap:wrap"><button data-act="th" data-v="1">기준 1명 (테스트)</button><button data-act="th" data-v="2">기준 2명</button><button data-act="th" data-v="${PEOPLE}">기준 ${PEOPLE}명 (배포)</button></div>
    <div class="field" style="flex-wrap:wrap;margin-top:8px">${!S.rev?`<button data-act="force" ${S.n?'':'disabled'}>지금 결과 공개</button>`:`<button data-act="unforce">결과 다시 가리기</button>`}
      <button data-act="new" style="background:var(--ink);color:var(--bg)">2차 투표 처음부터 다시</button><button data-act="logout">나가기</button></div>
    ${S.rev&&win()==='tie'?`<div class="tiebtns" style="margin-top:8px">${VENUES.map(v=>`<button class="btn" data-act="final" data-v="${v.id}">${esc(v.short)}로 결정</button>`).join('')}</div>`:''}
  </details>`;
}

/* 화면 */
function vHome(){
  const w=win();
  let now;
  if(!S.rev){
    now=S.me&&S.me.venue
      ?`<section class="now"><span class="now-tag">지금 할 일</span><b>투표를 마쳤습니다</b><p>나머지 팀원을 기다리고 있습니다. 모두 참여하면 결과가 바로 공개됩니다.</p>${meter()}<a class="btn ghost" href="#vote">내 투표 확인</a></section>`
      :`<section class="now"><span class="now-tag">지금 할 일</span><b>파티룸 2곳 중 1곳을 골라 주세요</b><p>코스 2(합정 당일)로 정해졌습니다. 이번에는 파티룸만 다시 정합니다.</p>${meter()}<a class="btn accent" href="#vote">파티룸 보고 투표하기</a></section>`;
  }else if(w==='tie') now=`<section class="now"><span class="now-tag">결과</span><b>동점입니다</b><p>관리자가 최종 파티룸을 정하면 확정됩니다.</p><a class="btn accent" href="#result">결과 보기</a></section>`;
  else now=`<section class="now"><span class="now-tag">결과</span><b>${esc(vOf(w).name)}로 확정되었습니다</b><p>투표 결과와 비용을 정리했습니다.</p><a class="btn accent" href="#result">결과 보기</a></section>`;
  return `
  <section class="hero"><img src="${DANG_PHOTOS[0].src}" alt="">
    <div class="hero-txt"><span class="hero-chip">2026 가을 워크샵 · 11.20 금 · 19–24시</span><h1>파티룸,<br>어디로 갈까요?</h1><p>두 곳 중 한 곳을 팀 투표로 정합니다.</p></div></section>
  ${now}
  <h2 class="h-m">후보</h2>
  <div class="venues">${VENUES.map(v=>card(v)).join('')}</div>
  ${adminTools()}`;
}
function vVote(){
  const sel=S.draft||(S.me&&S.me.venue), can=S.ready&&!S.noDb&&!S.rev;
  let hint=S.noDb?'서버에 연결하지 못했습니다. 잠시 후 새로고침해 주세요.':S.err?S.err:S.rev?'결과가 공개되어 투표가 마감되었습니다.':'1인 1표입니다. 결과 공개 전까지 선택을 바꿀 수 있고, 누가 어디에 투표했는지는 공개되지 않습니다.';
  return `
  <span class="eyebrow">파티룸 2차 투표</span>
  <h1 class="h-l">파티룸 2곳 중<br>1곳을 골라 주세요</h1>
  <p class="sub">${TH()}명이 모두 투표하면 결과가 자동으로 공개됩니다.</p>
  ${meter()}
  <div class="venues" style="margin-top:20px" role="radiogroup">${VENUES.map(v=>card(v,{checked:sel===v.id,disabled:!can})).join('')}</div>
  ${can?namePicker():''}
  <div class="row sticky-cta"><button class="btn accent" data-act="vote" ${can&&sel&&(S.myName||S.nameDraft)&&sel!==(S.me&&S.me.venue)&&!S.busy?'':'disabled'}>${S.me&&S.me.venue?'이 파티룸으로 변경':'이 파티룸으로 투표'}</button></div>
  <p class="note">${hint}</p>
  ${S.rev?`<div class="row"><a class="btn" href="#result">결과 보기</a></div>`:''}`;
}
function vResult(){
  if(!S.rev) return `<span class="eyebrow">결과</span><h1 class="h-l">아직 투표 중입니다</h1>${meter()}<div class="row"><a class="btn accent" href="#vote">투표하러 가기</a></div>`;
  const w=win(), v=w!=='tie'?vOf(w):null;
  const t=v?FIXED+v.price:0, over=Math.max(0,t-BASE), pp=over?Math.ceil(over/PEOPLE/100)*100:0;
  return `
  <span class="eyebrow">파티룸 2차 투표 결과</span>
  <h1 class="h-l">${v?esc(v.name):'동점입니다'}</h1>
  <p class="sub">${S.n}명 투표${v?` · ${esc(v.time)}`:''}</p>
  <section class="result"><div class="result-h"><b>득표</b><span class="small">${S.n}명 참여</span></div>${bars(ANIM)}
    ${S.me&&S.me.venue?`<p class="small" style="margin:10px 0 0">내 투표: ${esc(vOf(S.me.venue).name)}</p>`:''}
    ${v?`<p class="verdict"><b>${esc(v.name)}</b>로 확정되었습니다.</p>`:`<p class="verdict">동점입니다. 관리자가 최종 파티룸을 정합니다.</p>`}</section>
  ${v?`<div class="final-grid">
    <figure class="final-photo"><img src="${v.photos[0].src}" alt=""><figcaption><b>${esc(v.name)}</b><span>${esc(v.time)} · ${esc(v.extras)}</span><span>${esc(v.addr)}</span></figcaption></figure>
    <div class="final-side">
      <div class="total"><div><span>코스 2 예상 합계</span><br><b>${won(t)}</b></div><div class="pp"><span>1인 추가 부담</span><br><b>${over?'약 '+wonExact(pp):'없음'}</b></div></div>
      <ul class="support"><li><span>식비 + 팀 액티비티</span><b>${won(FIXED)}</b></li><li><span>파티룸 대관</span><b>${won(v.price)}</b></li><li><span>회사 지원</span><b>−${won(BASE)}</b></li><li><span>${PEOPLE}명 분담</span><b>${over?'1인 '+wonExact(pp):'추가 부담 없음'}</b></li></ul>
      <div class="row"><a class="btn ghost" href="${v.link}" target="_blank" rel="noopener noreferrer">네이버에서 장소 보기</a></div>
    </div></div>`:''}
  ${adminTools()}`;
}

/* 연출 */
let ANIM=false, ovT=null;
function overlay(o){
  const el=document.getElementById('overlay');
  el.innerHTML=`<div class="ov-card"><span class="ov-tag">${o.tag}</span><b class="ov-t">${o.title}</b><p>${o.sub}</p><div class="ov-big">${o.big}</div><button class="btn accent" data-ov>${o.cta}</button></div>`;
  el.classList.add('on');
  const done=()=>{clearTimeout(ovT);el.classList.remove('on');go(o.href);};
  el.querySelector('[data-ov]').onclick=done; ovT=setTimeout(done,3200);
}
function effects(){
  if(!S.ready||document.getElementById('overlay').classList.contains('on')) return;
  if(!S.rev){store.del(seenKey('r'));return;}
  if(!store.get(seenKey('r'))){store.set(seenKey('r'),'1');const w=win();
    overlay({tag:'파티룸 투표 완료',title:S.n>=TH()?`${TH()}명 모두 투표했습니다`:'결과가 공개되었습니다',sub:'결과를 공개합니다.',big:w==='tie'?'동점':esc(vOf(w).name),cta:'결과 보기',href:'#result'});}
}
function animate(){
  document.querySelectorAll('.fill[data-w]').forEach(f=>{if(f.style.width==='0%')requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width=f.dataset.w+'%'));});
  document.querySelectorAll('.n[data-n]').forEach(e=>{const to=+e.dataset.n;if(e.textContent!=='0표')return;let k=0;const st=()=>{k++;e.textContent=Math.round(to*Math.min(1,k/24))+'표';if(k<24)requestAnimationFrame(st)};requestAnimationFrame(st);});
}

/* 라우팅 */
const VIEWS=['home','vote','result'];
function go(h){const v=String(h||'').replace(/^#/,'');S.view=VIEWS.includes(v)?v:'home';try{history.replaceState(null,'','#'+S.view)}catch(e){}render(true);}
function render(scroll){
  ANIM=!!scroll; let html;
  try{ html=S.view==='vote'?vVote():S.view==='result'?vResult():vHome(); }
  catch(err){ html=`<h1 class="h-l">화면을 그리지 못했습니다</h1><pre class="small" style="white-space:pre-wrap">${esc(String(err&&err.stack||err))}</pre>`; }
  const y=window.scrollY;
  document.getElementById('app').innerHTML=html;
  document.getElementById('stepper').innerHTML=stepper();
  const nav=S.view; document.querySelectorAll('.steps a').forEach(a=>{if(a.dataset.v===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  document.querySelector('.steps a[data-v="result"]').hidden=!S.rev;
  window.scrollTo(0,scroll?0:y);
  try{animate();effects();}catch(e){}
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==S.view){S.view=VIEWS.includes(h)?h:'home';render(true);}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href'));},true);
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('tools'))S.toolsOpen=e.target.open;},true);
document.addEventListener('change',e=>{
  if(e.target.name==='pv'){S.draft=e.target.value;render(false);}
  if(e.target.id==='np'){S.nameDraft=e.target.value||null;render(false);}
});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* 서버 */
const SB_URL='https://ojxxhgzxcbhcsdfsjqhw.supabase.co', SB_KEY='sb_publishable_YJHLla74UWW0xp74fmuZbA_eFDfH7kd';
async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text(); let j=null; try{j=JSON.parse(t)}catch(e){}
  if(!r.ok) throw new Error((j&&j.message)||t||('HTTP '+r.status)); return j;
}
const ERR={name_taken:'이 이름은 다른 기기에서 이미 투표했습니다.',unknown_name:'명단에 없는 이름입니다.',closed:'결과가 공개되어 투표가 마감되었습니다.',token_used:'이 기기에서는 이미 다른 이름으로 투표했습니다.',bad_pin:'PIN이 맞지 않습니다.'};
const errMsg=e=>{const m=String(e&&e.message||e);const k=Object.keys(ERR).find(x=>m.includes(x));return k?ERR[k]:'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';};
let last='';
function apply(st){
  if(!st) return; const js=JSON.stringify(st), changed=js!==last; last=js;
  S.th=+st.threshold||PEOPLE; S.round=st.round||'r1'; S.names=st.names||[]; S.voted=st.voted||[]; S.n=st.n||0; S.rev=!!st.rev;
  S.counts=st.counts||{}; S.final=st.final||null; S.forced=!!st.forced; S.me=st.me||null;
  if(S.me&&S.me.name) S.myName=S.me.name;
  if(!S.ready){S.ready=true;render(false);return;}
  if(changed){const ae=document.activeElement;if(!(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)))render(false);}
}
async function refresh(){ try{apply(await rpc('ws26p2_status',{p_token:TOKEN}));}catch(e){ if(!S.ready){S.noDb=true;render(false);} } }
async function admin(action,value){ await rpc('ws26p2_admin',{p_pin:S.pin,p_action:action,p_value:value===undefined?null:value}); await refresh(); }
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  try{
    if(act==='vote'){
      const name=S.myName||S.nameDraft; if(!S.draft||!name||S.busy) return;
      S.busy=true; S.err=''; render(false);
      const st=await rpc('ws26p2_vote',{p_name:name,p_token:TOKEN,p_value:S.draft});
      S.myName=name; store.set('name',name); S.draft=null; S.nameDraft=null; S.busy=false; apply(st); render(false); toast('투표했습니다');
    }else if(act==='login'){
      const pin=document.getElementById('pin').value.trim(); await rpc('ws26p2_admin',{p_pin:pin,p_action:'check',p_value:null});
      S.pin=pin; S.isAdmin=true; store.set('pin',pin); toast('관리자 모드입니다'); render(false);
    }else if(act==='logout'){ S.isAdmin=false; store.del('pin'); render(false);
    }else if(act==='th'){ await admin('threshold',+b.dataset.v); toast('공개 기준을 '+b.dataset.v+'명으로 바꿨습니다');
    }else if(act==='force'){ await admin('forced',true);
    }else if(act==='unforce'){ await admin('forced',false);
    }else if(act==='final'){ await admin('final',b.dataset.v);
    }else if(act==='new'){ if(!confirm('2차 파티룸 투표를 처음부터 다시 시작할까요? (1차 투표 결과에는 영향이 없습니다)')) return; await admin('new_round'); S.draft=null; toast('2차 투표를 다시 시작합니다'); }
  }catch(err){ S.busy=false; const m=errMsg(err); if(act!=='login') S.err=m; toast(m); render(false); }
});
(async()=>{
  S.myName=store.get('name')||(()=>{try{return localStorage.getItem('ws26-name')}catch(e){return null}})();
  const pin=store.get('pin')||(()=>{try{return localStorage.getItem('ws26-pin')}catch(e){return null}})();
  if(pin){try{await rpc('ws26p2_admin',{p_pin:pin,p_action:'check',p_value:null});S.pin=pin;S.isAdmin=true;store.set('pin',pin);}catch(e){}}
  const h=location.hash.slice(1); S.view=VIEWS.includes(h)?h:'home'; render(false);
  await refresh(); setInterval(()=>{if(!document.hidden)refresh();},3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
})();
</script>
